name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar cabecalhos do AML
        run: git clone --depth 1 --recursive https://github.com/RusJJ/AndroidModLoader aml
      - name: Compilar
        run: |
          CXX=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
          $CXX -shared -fPIC -O2 -std=c++17 -static-libstdc++ -Iaml -Iaml/include mod.cpp aml/mod/logger.cpp aml/mod/config.cpp -o libFPSTest.so -llog
      - uses: actions/upload-artifact@v4
        with:
          name: libFPSTest
          path: libFPSTest.so
